name: Build EnemySense

on:
  push:
    paths:
      - 'EnemySense/**'
      - '.github/workflows/build-enemysense.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EnemySense/EnemySense.csproj

      - name: Build
        run: dotnet build EnemySense/EnemySense.csproj -c Release --no-restore

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item EnemySense/bin/Release/net48/EnemySense.dll artifact/EnemySense.dll
          Compress-Archive -Path artifact/EnemySense.dll -DestinationPath artifact/EnemySense-2.0.0.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: EnemySense-2.0.0
          path: |
            artifact/EnemySense.dll
            artifact/EnemySense-2.0.0.zip
